[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlm-harness"
version = "0.1.0"
description = "A unified evaluation framework for Vision Language Models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "tqdm>=4.66.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
google = ["google-generativeai>=0.7.0"]
huggingface = ["transformers>=4.40.0", "torch>=2.0.0", "accelerate>=0.30.0"]
vllm = ["vllm>=0.4.0"]
ollama = ["ollama>=0.2.0"]
litellm = ["litellm>=1.40.0"]
lm-eval = ["lm-eval>=0.4.0"]
metrics = ["rouge-score>=0.1.2", "nltk>=3.8", "sacrebleu>=2.4.0"]
# Generative (text-to-image) support: local diffusers backend + CLIPScore /
# GenEval-approximation / FID metrics. The mock T2I adapter needs none of this.
generative = [
    "torch>=2.0.0",
    "torchvision>=0.18.0",
    "transformers>=4.40.0",
    "diffusers>=0.27.0",
    "scipy>=1.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
all = [
    "vlm-harness[anthropic,openai,google,huggingface,metrics,lm-eval,generative]",
]

[project.scripts]
vlm-harness = "vlm_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_harness"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
