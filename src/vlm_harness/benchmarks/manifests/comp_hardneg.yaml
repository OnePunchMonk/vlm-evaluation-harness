name: CompHardNeg
version: "1.0"
description: >
  Compositional hard-negative multiple choice, in the spirit of ConMe / ARO /
  VL-CHECKLIST (2026 revisits: ConMe, arXiv:2406.08164; SCRAMBLe). Each
  sample pairs an image of two shapes with one correct caption and three
  hard negatives generated by swapping a single compositional axis
  (attribute/color, spatial relation, or object identity) — probing whether
  a model actually binds attributes/relations to the right entities rather
  than pattern-matching on bag-of-words caption similarity. Fully offline.
taxonomy_category: reasoning
modality: 2d

source:
  type: local
  path: ../fixtures/comp_hardneg

splits:
  - name: validation
    scorable: true

task_type: multiple_choice

fields:
  question: question
  choices: choices
  answer: answer
  images:
    - image
  subject: category

image_config:
  max_images: 1
  placement: before_text

prompt_template: |
  {question}

  Options:
  {formatted_choices}

  Answer with the option letter only.

answer_extraction:
  strategy: first_letter
  normalize: uppercase

metrics:
  - type: accuracy
  - type: accuracy_by_group
    group_field: subject

few_shot:
  count: 0
