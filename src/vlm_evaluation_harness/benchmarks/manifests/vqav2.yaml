name: VQAv2
schema_version: "1.0"
version: "1.0"
description: >
  Visual Question Answering v2. Open-ended questions about natural images,
  balanced to reduce language bias. Requires both visual and language understanding.
taxonomy_category: perception
modality: 2d

source:
  type: huggingface
  path: HuggingFaceM4/VQAv2
  revision: 4b98c864262e9db184eb039e85e97e6630825b6a

splits:
  - name: validation
    scorable: true
  - name: test
    scorable: false

task_type: open_ended

fields:
  question: question
  # VQAv2 ships ten independent annotator answers per question; scoring
  # against a single canonical one systematically under-reports and is not
  # comparable to any published VQAv2 number.
  answers: answers
  images:
    - image

image_config:
  max_images: 1
  placement: before_text

prompt_template: |
  {question}

  Answer with a short phrase or single word.

answer_extraction:
  strategy: exact
  normalize: vqa

metrics:
  - type: vqa_accuracy
  - type: f1

few_shot:
  count: 0
